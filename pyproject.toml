[project]
name = "audiomanifolds"
version = "0.0.1"
description = "A package for studying the manifolds generated by embeddings from pretrained audio models."
readme = "README.md"
authors = [
    { name = "Aramis Tanelus", email = "aramis.tanelus@nyu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.3.5",
    "pytest>=9.0.1",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchlibrosa>=0.1.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
